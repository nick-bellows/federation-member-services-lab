# Attention:
# This compose file is designed to be used in a development environment.
# It includes services for the database, API, API documentation, web application, and tooling.
name: vereinfacht

networks:
  stack:
    external: false

volumes:
  mariadb:

services:
  database:
    image: mariadb:11.8
    volumes:
      - mariadb:/var/lib/mysql:cached
    networks:
      - stack
    restart: always
    ports:
      - 3306:3306
    environment:
      - MARIADB_RANDOM_ROOT_PASSWORD=true
      - MARIADB_DATABASE=verein
      - MARIADB_USER=verein
      - MARIADB_PASSWORD=verein

  api:
    build:
      context: .
      dockerfile: ./docker/api/api.Dockerfile
      args:
        USER_ID: $USER_ID
        GROUP_ID: $GROUP_ID
    depends_on:
      - database
    environment:
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
    networks:
      - stack
    working_dir: /var/www/html
    volumes:
      - ./api:/var/www/html
    ports:
      - 3001:80
    # Federation (fork): lets the container reach the mock OIDC issuer under the
    # same hostname the browser uses. Docker Desktop provides it; Linux needs this.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  api-docs:
    image: docker.swagger.io/swaggerapi/swagger-ui
    depends_on:
      - api
    networks:
      - stack
    environment:
      - SWAGGER_JSON_URL=http://localhost:3001/v1_openapi.json
      - BASE_URL=/
    ports:
      - 3002:8080
    restart: always

  web_application:
    build:
      context: .
      dockerfile: ./docker/web_application/web_application.Dockerfile
      args:
        USER_ID: $USER_ID
        GROUP_ID: $GROUP_ID
    depends_on:
      - api
      - database
    networks:
      - stack
    ports:
      - 3003:3000
    restart: always

  # Federation (fork): a self-hosted OpenID Connect provider for development and
  # CI, so nothing depends on an external account. Issuer as seen by the browser:
  # http://host.docker.internal:3004/default. The API fetches keys over the compose network
  # (OIDC_JWKS_URI=http://oidc:8080/default/jwks). Personas for non-interactive
  # tokens are defined in docker/oidc/config.json.
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      - SERVER_PORT=8080
      - JSON_CONFIG_PATH=/config.json
    volumes:
      - ./docker/oidc/config.json:/config.json:ro
    networks:
      - stack
    ports:
      - 3004:8080
    restart: always

  # Traces (ADR-0012). The API exports OTLP over HTTP to jaeger:4318; the UI is
  # http://localhost:3006. Nothing here leaves the machine.
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - stack
    ports:
      - 3006:16686

  # Third engine of the compatibility matrix (docs/DATABASE_COMPATIBILITY.md).
  # Off by default: `docker compose --profile postgres up -d postgres`, then run
  # the suite from tooling with DB_CONNECTION=pgsql DB_HOST=postgres (see README).
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      - POSTGRES_DB=verein_test
      - POSTGRES_USER=verein
      - POSTGRES_PASSWORD=verein
    networks:
      - stack
    ports:
      - 5432:5432

  # Mock of the Learning Center credentials contract (ADR-0009). Serves the
  # fixture files that are the contract's source of truth; MOCK_DELAY_MS
  # reproduces INCIDENT-001. The API reaches it as http://learning-center:3005.
  learning-center:
    image: node:20-alpine
    command: ["node", "/app/server.js"]
    working_dir: /app
    environment:
      - PORT=3005
      - MOCK_DELAY_MS=${LEARNING_CENTER_MOCK_DELAY_MS:-0}
      - FIXTURES_DIR=/fixtures
    volumes:
      - ./docker/learning-center-mock:/app:ro
      - ./api/tests/Fixtures/learning-center/credentials:/fixtures:ro
    networks:
      - stack
    ports:
      - 3005:3005

  tooling:
    build:
      context: .
      dockerfile: ./docker/tooling/tooling.Dockerfile
      args:
        USER_ID: $USER_ID
        GROUP_ID: $GROUP_ID
    networks:
      - stack
    tty: true
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - 3000:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
