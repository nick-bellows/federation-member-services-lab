name: Publish Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

jobs:
  publish-release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # The branch name is untrusted input: it reaches the shell through an
      # environment variable, never through template interpolation into the
      # script (GitHub's script-injection guidance); the version derived from
      # it is read as a shell variable below for the same reason.
      - name: Extract version from branch name
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION="${HEAD_REF#release/}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create tag and GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release version $VERSION"
          git push origin tag "$VERSION"

          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --notes "$(awk '/## \[/{flag=1;next}/## \[/{flag=0}flag' CHANGELOG.md)"
