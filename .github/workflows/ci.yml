# Continuous integration for the fork.
#
# First run on GitHub: 2026-09-03, pull request #1. The first two runs failed
# on three things the local stack could not show (an engine assumption in a
# test, name resolution for the runner's browser, a migration race in the
# browser job); the fixes are in the history and in docs/LEARNING_LOG.md.
# Green on both the push and the pull-request run since 99aca82, and on main.
#
# Jobs: backend tests on SQLite (upstream's test configuration), on MariaDB
# (the runtime engine) and on PostgreSQL 16 (the compatibility matrix's strict engine), Pint as a report,
# frontend type-check, lint and production build, an env() misuse guard, and an
# upstream-versus-fork manifest published to the job summary.

name: CI

on:
  push:
    branches: [main, "m*/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.3"
  NODE_VERSION: "20"
  PHP_EXTENSIONS: mbstring, intl, gd, imagick, zip, bcmath, exif, pdo_sqlite, sqlite3, pdo_mysql, pdo_pgsql

jobs:
  backend-sqlite:
    name: Backend tests (SQLite, upstream configuration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - name: Install Ghostscript (PDF preview conversions in media tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q ghostscript
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('api/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan test

  backend-mariadb:
    name: Backend tests (MariaDB 11.8, runtime engine)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      database:
        image: mariadb:11.8
        env:
          MARIADB_RANDOM_ROOT_PASSWORD: "true"
          MARIADB_DATABASE: verein_test
          MARIADB_USER: verein
          MARIADB_PASSWORD: verein
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Real process environment wins over .env.testing, so the suite runs on MariaDB.
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: verein_test
      DB_USERNAME: verein
      DB_PASSWORD: verein
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - run: sudo apt-get update -q && sudo apt-get install -y -q ghostscript
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('api/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan test

  backend-postgres:
    name: Backend tests (PostgreSQL 16, compatibility matrix)
    # The third engine of docs/DATABASE_COMPATIBILITY.md (ADR-0011): the whole
    # suite plus the demo seeder, on the engine that rejects what SQLite tolerates.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: verein_test
          POSTGRES_USER: verein
          POSTGRES_PASSWORD: verein
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U verein -d verein_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: verein_test
      DB_USERNAME: verein
      DB_PASSWORD: verein
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - run: sudo apt-get update -q && sudo apt-get install -y -q ghostscript
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('api/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan test
      - name: Seed the demo data on PostgreSQL
        run: |
          cp .env.example .env && php artisan key:generate --no-interaction
          php artisan migrate:fresh --seeder=NorthgateDemoSeeder --no-interaction --force
          php artisan federation:outbox-status

  backend-style:
    name: Backend style (Pint, report only) and env() guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('api/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Pint on the fork's own code (enforced)
        # Fork-owned paths plus every migration the fork ADDED relative to upstream
        # (touched upstream files keep upstream's style and are not enforced).
        run: |
          git fetch --quiet https://github.com/vereinfacht/vereinfacht.git main
          FORK_MIGRATIONS=$(git diff --name-only --diff-filter=A FETCH_HEAD...HEAD -- database/migrations | sed 's|^api/||')
          vendor/bin/pint --test \
            app/Federation \
            tests/Unit/Federation tests/Feature/Federation tests/Unit/WebApplicationUrlConfigTest.php \
            database/factories/Federation database/seeders/NorthgateDemoSeeder.php \
            $FORK_MIGRATIONS
      - name: Pint on the whole tree (upstream carries 215 pre-existing issues; reported, not enforced)
        continue-on-error: true
        run: |
          vendor/bin/pint --test 2>&1 | tail -n 5 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: env() must not be used outside config/ (ADR-0002)
        run: |
          if grep -rn "env(" app routes database resources | grep -v "config("; then
            echo "::error::env() called outside config/. Read settings through config() instead (ADR-0002)."
            exit 1
          fi
          echo "No env() calls outside config/." | tee -a "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend type-check, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web_application/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Production build (no API needed; validated locally 2026-09-02)
        run: npx next build

  e2e:
    name: End-to-end (Playwright + axe) against the compose stack
    # The browser runs on the runner, outside Docker: extra_hosts in
    # docker-compose.yml resolves host.docker.internal for containers only, so the
    # runner needs its own entry for the OIDC issuer host (first run, 2026-09-03).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the OIDC issuer host for the runner's browser
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      - name: Start database, API, mock OIDC provider and tooling
        run: |
          printf 'USER_ID=1001\nGROUP_ID=1001\n' > .env
          docker compose up -d --build database api oidc learning-center tooling
      - name: Wait for the API container to finish its own migration
        # docker/api/entrypoint.sh migrates the empty database at start-up. A
        # migrate:fresh from tooling at the same time waits on MariaDB metadata
        # locks with no timeout; the second run on 2026-09-03 hung there for 45
        # minutes. Same ordering as the README's run instructions.
        run: |
          for i in $(seq 1 100); do
            if docker compose logs api 2>&1 | grep -q "Starting the app"; then exit 0; fi
            sleep 3
          done
          echo "The API container did not report 'Starting the app' within five minutes"
          docker compose logs --tail=60 api
          exit 1
      - name: Install and seed inside the tooling container
        run: |
          docker compose exec -T tooling bash -lc '
            set -e
            cd api
            composer install --no-interaction --prefer-dist --no-progress
            cp .env.example .env && php artisan key:generate --no-interaction
            sed -i "s/^MAIL_MAILER=smtp/MAIL_MAILER=log/" .env
            php artisan migrate:status | tail -n 2
            php artisan migrate:fresh --seeder=NorthgateDemoSeeder --no-interaction
            php artisan filament:assets && npm ci && npm run build
            cd ../web_application
            cp .env.local.example .env.local && npm ci'
          docker compose restart api
      - name: Start the Next.js dev server
        run: |
          docker compose exec -d tooling bash -lc 'cd web_application && npx next dev > /tmp/next-dev.log 2>&1'
          for i in $(seq 1 60); do curl -sf http://localhost:3000/en/member/sign-in >/dev/null && break; sleep 3; done
          curl -sf -o /dev/null http://localhost:3000/en/member/sign-in
      - name: Start the outbox relay and queue worker
        # In the api container as its PHP-FPM user: the worker writes the same
        # cache and log files as the web process, and a second user on the shared
        # storage mount locks the web process out (INCIDENT-003 rehearsal).
        run: docker compose exec -d -u verein api bash -lc 'php artisan federation:work > /tmp/federation-work.log 2>&1'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
      - name: Logs on failure or cancellation
        if: failure() || cancelled()
        run: |
          docker compose logs --tail=100 api
          docker compose exec -T tooling bash -lc 'tail -n 100 /tmp/next-dev.log' || true

  upstream-manifest:
    name: Upstream-versus-fork manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff against upstream main
        run: |
          git fetch --quiet https://github.com/vereinfacht/vereinfacht.git main
          {
            echo "## Files that differ from upstream vereinfacht/vereinfacht@main"
            echo
            echo '```'
            git diff --stat FETCH_HEAD...HEAD
            echo '```'
            echo
            echo "## Commits not in upstream"
            echo
            git log --oneline FETCH_HEAD..HEAD | sed 's/^/- /'
          } | tee -a "$GITHUB_STEP_SUMMARY"
